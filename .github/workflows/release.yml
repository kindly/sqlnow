# Release builds. Every target compiles natively on its own runner (no
# cross-compilation — DuckDB's bundled C++ makes cross builds painful), and
# Linux targets use glibc rather than musl because sqlnow dlopen()s DuckDB
# extensions at runtime, which static musl binaries cannot do.
#
# The web UI is committed pre-built in libsqlnow/static/ and embedded via
# include_dir, so no Node step is needed here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04 # oldest supported = lowest glibc floor
            linux-packages: true
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
            linux-packages: true
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest

    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/sqlnow LICENSE README.md AGENTS.md dist/
          tar -C dist -czf sqlnow-${{ matrix.target }}.tar.gz sqlnow LICENSE README.md AGENTS.md
          shasum -a 256 sqlnow-${{ matrix.target }}.tar.gz > sqlnow-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/sqlnow.exe, LICENSE, README.md, AGENTS.md dist/
          Compress-Archive -Path dist/* -DestinationPath sqlnow-${{ matrix.target }}.zip
          (Get-FileHash sqlnow-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  sqlnow-${{ matrix.target }}.zip" | Set-Content sqlnow-${{ matrix.target }}.zip.sha256

      - name: Build .deb and .rpm
        if: matrix.linux-packages
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build --no-strip -p sqlnow -o sqlnow-${{ matrix.target }}.deb
          cargo generate-rpm -p sqlnow -o sqlnow-${{ matrix.target }}.rpm

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlnow-${{ matrix.target }}
          path: |
            sqlnow-*.tar.gz*
            sqlnow-*.zip*
            sqlnow-*.deb
            sqlnow-*.rpm

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sqlnow-*.tar.gz*
            sqlnow-*.zip*
            sqlnow-*.deb
            sqlnow-*.rpm

  # The desktop shell: an electron window over the same server binary, packaged
  # per platform by electron-builder. One renderer everywhere, which is why it
  # replaced the tauri shell — three system webviews meant three text
  # rasterisers and no way to test the two you do not run.
  #
  # Each job builds the server for its own platform first: electron-builder
  # copies it in as a resource, so the app is self-contained.
  desktop:
    name: desktop ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04 # oldest supported = lowest glibc floor
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest

    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sqlnow-electron/package-lock.json

      - name: Build the server
        run: cargo build --release --locked -p sqlnow

      - name: Install
        working-directory: sqlnow-electron
        shell: bash
        # npm 12 blocks install scripts unless approved, and electron's is what
        # fetches its binary — so check for it rather than assume
        run: |
          npm ci
          node -e "process.exit(require('fs').existsSync('node_modules/electron/dist') ? 0 : 1)" \
            || node node_modules/electron/install.js

      - name: Package
        working-directory: sqlnow-electron
        # unsigned on mac and windows: signing needs certificates this project
        # does not have, so the installers warn on first run
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --publish never

      - name: Collect
        shell: bash
        # electron-builder names them itself (artifactName in package.json), so
        # this only gathers them and writes the checksums
        run: |
          mkdir -p out
          cp sqlnow-electron/dist/sqlnow-desktop-* out/ 2>/dev/null || true
          cd out
          # sha256sum on linux, shasum on macOS: whichever the runner has
          hash=$(command -v sha256sum || echo "shasum -a 256")
          for f in *; do $hash "$f" > "$f.sha256"; done
          ls -la

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sqlnow-desktop-${{ matrix.target }}
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
