name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  # The desktop shell is an electron window over the same server, so the only
  # thing worth testing is that a real window really does load a real session.
  # It needs a display, hence xvfb; SQLNOW_SMOKE makes the shell report what it
  # loaded and exit instead of waiting for someone to close it.
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sqlnow-electron/package-lock.json

      - name: Build the server
        run: cargo build --locked -p sqlnow

      - name: Install
        working-directory: sqlnow-electron
        # npm 12 blocks install scripts unless approved, and electron's is what
        # fetches its binary — so check for it rather than assume
        run: |
          npm ci
          test -x node_modules/electron/dist/electron || node node_modules/electron/install.js

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libgbm1 libasound2 libxkbcommon0 libgtk-3-0

      - name: Smoke test
        working-directory: sqlnow-electron
        env:
          SQLNOW_BIN: ${{ github.workspace }}/target/debug/sqlnow
          SQLNOW_SMOKE: '1'
        run: |
          printf 'name,co2\nPlant A,120\n' > plants.csv
          xvfb-run --auto-servernum ./node_modules/electron/dist/electron . plants.csv \
            -q 'peek=SELECT * FROM plants' --open peek | tee smoke.log
          grep -q 'SMOKE .*title=sqlnow tables=plants' smoke.log

      - name: Still alive past the startup timeout
        working-directory: sqlnow-electron
        env:
          SQLNOW_BIN: ${{ github.workspace }}/target/debug/sqlnow
          SQLNOW_STARTUP_MS: '2000'
          SQLNOW_LIVE_CHECK: '6000'
        # the timer that gives up on a server that never reports was left
        # running after one did: a minute in, the shell SIGKILLed its own
        # server and the window sat there with nothing behind it
        run: |
          xvfb-run --auto-servernum ./node_modules/electron/dist/electron . plants.csv | tee live.log
          grep -q 'LIVE after=6000ms server_alive=true page_can_reach_it=true' live.log

      - name: Switching a window to another session
        working-directory: sqlnow-electron
        env:
          SQLNOW_BIN: ${{ github.workspace }}/target/debug/sqlnow
          SQLNOW_SWITCH_CHECK: '1'
        # the new server starts before the old one stops, so a session that
        # cannot be opened leaves the window on what it was showing
        run: |
          printf 'e,f\n5,6\n' > switchto.csv
          "$SQLNOW_BIN" switchto.csv --port 0 & sleep 5; kill %1 || true
          sleep 3
          xvfb-run --auto-servernum ./node_modules/electron/dist/electron . plants.csv | tee switch.log
          grep -q 'SWITCH windows=1 address_changed=true old_server_stopped=true reachable=true' switch.log

      - name: A session whose address is stale
        working-directory: sqlnow-electron
        env:
          SQLNOW_BIN: ${{ github.workspace }}/target/debug/sqlnow
          SQLNOW_STALE_CHECK: '1'
        # a server killed outright leaves its address in the store; following
        # one opens a window on a dead port, which is a blank page
        run: |
          printf 'c,d\n3,4\n' > other.csv
          "$SQLNOW_BIN" other.csv --port 0 &
          sleep 5 && kill -9 %1 || true
          "$SQLNOW_BIN" exec "$HOME/.config/sqlnow/sessions.sqlnow" \
            "UPDATE sessions SET url = 'http://127.0.0.1:9'" > /dev/null
          xvfb-run --auto-servernum ./node_modules/electron/dist/electron . plants.csv | tee stale.log
          grep -q 'STALE claimed=http://127.0.0.1:9 .* opened_reachable=true' stale.log

      - name: Menu
        working-directory: sqlnow-electron
        env:
          SQLNOW_BIN: ${{ github.workspace }}/target/debug/sqlnow
        # the menu is the only way to attach data or reach another session, and
        # the only Close on a desktop that draws no window decorations
        # with a deep link in play, because the address the window opens on is
        # not the address the menu asks: when they were the same value every
        # request went to /queries/<name>/api/… and 404'd
        run: |
          printf 'a,b\n1,2\n' > viewme.csv
          printf 'c,d\n3,4\n' > loadme.csv
          SQLNOW_MENU_CHECK="$PWD/viewme.csv,$PWD/loadme.csv" \
            xvfb-run --auto-servernum ./node_modules/electron/dist/electron . plants.csv \
              -q 'peek=SELECT * FROM plants' --open peek | tee menu.log
          grep -q 'MENU menus=&File,&Session,&View file=6 sessions=1 listed=1 current=1 in_new_window=1 failures=0 tables=loadme,plants,viewme inputs=table:loadme,view:plants,view:viewme' menu.log

      - name: Zoom keys
        working-directory: sqlnow-electron
        env:
          SQLNOW_BIN: ${{ github.workspace }}/target/debug/sqlnow
          SQLNOW_ZOOM_CHECK: '1'
        # ctrl+= and ctrl+0 were both dead when zoom was left to electron's
        # default menu, which binds the shifted `+` only
        run: |
          xvfb-run --auto-servernum ./node_modules/electron/dist/electron . plants.csv | tee zoom.log
          grep -q 'ZOOM start .* ctrl+= -> 1.00 .* ctrl+0 -> 0.00 .* plain = -> 0.00' zoom.log

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build
