[workspace]
members = ["libsqlnow", "sqlnow"]
resolver = "2"

[workspace.dependencies]
actix-web = "4.3.1"
tokio = { version = "1.28.2", features = ["time", "signal"] }
clap = { version = "4.3.8", features = ["derive"] }
eyre = "0.6.8"
serde = { version = "1.0.169", features = ["derive"] }
serde_json = "1.0.100"
url = "2.4.0"
tracing-subscriber = "0.3.17"
csv = "1.2.2"
duckdb = { version = "1.10505.0", features = ["extensions-full", "bundled"] }
regex = "1"

[profile.release]
strip = "symbols"

