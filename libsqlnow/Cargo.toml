[package]
name = "libsqlnow"
version = "0.4.8"
edition = "2021"
license = "MIT"
description = "Server library for sqlnow: DuckDB-backed SQL viewer with agent-seeded queries and session files"
repository = "https://github.com/kindly/sqlnow"

[dependencies]
actix-web = {"workspace" = true}
tokio = {"workspace" = true}
clap = {"workspace" = true}
eyre = {"workspace" = true}
csv = {"workspace" = true}
regex = {"workspace" = true}
serde = {"workspace" = true}
serde_json = {"workspace" = true}
duckdb = {"workspace" = true}
url = {"workspace" = true}
tracing-subscriber = {"workspace" = true}
include_dir = "0.7.3"
futures-util = "0.3.28"
async-stream = "0.3.5"
csvs_convert = { version = "0.13.2", default-features = false, features = ["converters"] }
actix-files = "0.6.5"
mime_guess = "2"
calamine = "0.24.0"
libflatterer = { version = "0.25.0", default-features = false }
tempfile = "3.10.1"
arrow-cast = "58"
