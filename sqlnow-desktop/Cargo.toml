[package]
name = "sqlnow-desktop"
version = "0.4.1"
edition = "2021"
description = "Desktop shell for sqlnow: the same local server and UI in a native window"
license = "MIT"
repository = "https://github.com/kindly/sqlnow"

[dependencies]
sqlnow = { path = "../sqlnow" }
# devtools is what keeps the inspector in a release build: tauri and wry gate
# open_devtools (and webkit's developer extras) on `debug_assertions` or this
# feature, so without it the published binary has no way to inspect anything
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "devtools"] }
actix-web = { workspace = true }
eyre = { workspace = true }

# the webview's own zoom hotkeys are implemented for WebView2 only, so on
# linux the shortcuts are wired to gtk by hand. Version-matched to tauri's own
# gtk, since that is where the window comes from.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# the startup test needs a sqlite database to attach; rusqlite is already in
# the lockfile through the loaders
rusqlite = { version = "0.40", features = ["bundled"] }
