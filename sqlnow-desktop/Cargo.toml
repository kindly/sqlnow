[package]
name = "sqlnow-desktop"
version = "0.4.0"
edition = "2021"
description = "Desktop shell for sqlnow: the same local server and UI in a native window"
license = "MIT"
repository = "https://github.com/kindly/sqlnow"

[dependencies]
sqlnow = { path = "../sqlnow" }
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6"] }
actix-web = { workspace = true }
eyre = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
