[package]
name = "sqlnow"
version = "0.4.7"
edition = "2021"
description = "Local SQL viewer for files and databases, with pre-defined queries for LLM-agent workflows"
license = "MIT"
repository = "https://github.com/kindly/sqlnow"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# used by cargo-deb / cargo-generate-rpm in the release workflow
[package.metadata.deb]
assets = [
    ["target/release/sqlnow", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/sqlnow/README.md", "644"],
    ["../AGENTS.md", "usr/share/doc/sqlnow/AGENTS.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/sqlnow", dest = "/usr/bin/sqlnow", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/sqlnow/README.md", mode = "644", doc = true },
    { source = "AGENTS.md", dest = "/usr/share/doc/sqlnow/AGENTS.md", mode = "644", doc = true },
]

[dependencies]
actix-web = {"workspace" = true}
tokio = {"workspace" = true}
clap = {"workspace" = true}
eyre = {"workspace" = true}
csv = {"workspace" = true}
serde = {"workspace" = true}
serde_json = {"workspace" = true}
url = {"workspace" = true}
tracing-subscriber = {"workspace" = true}
libsqlnow = {path = "../libsqlnow"}
open = "5.1.2"

[dev-dependencies]
# the integration tests drive the built binary over http; ureq is blocking,
# which suits a test, and is already in the lockfile
ureq = { version = "2", default-features = false }
# multi-table sqlite fixtures for the table filters
rusqlite = { version = "0.40", features = ["bundled"] }
